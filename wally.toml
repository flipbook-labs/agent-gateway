[package]
name = "flipbook-labs/agent-gateway"
description = "Action registry and agent gateway for Roblox Studio plugins"
version = "0.2.1"
license = "MIT"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
exclude = ["*"]
include = [
	"dist",
	"dist/**",
	"default.project.json",
	"LICENSE",
	"README.md",
	"wally.toml",
]

[dependencies]

#[dev-dependencies]
Jest = "roblox/jest@3.21.0"
JestGlobals = "roblox/jest-globals@3.21.0"
